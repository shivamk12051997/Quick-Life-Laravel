<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
  	.input-box span {
        display: block;
        width: 2px;
        height: 100%;
        background-color: #ccc;
        position: absolute;
    	content: '';
        border: 1px solid #ccc;
        top: 0;
    }
  	
  	.input-box span:nth-child(1) {
       left: 50px;
    }
  	.input-box span:nth-child(2) {
       left: 100px;
    }
  	.input-box span:nth-child(3) {
       left: 150px;
    }
    .input-box span:nth-child(4) {
         left: 200px;
    }
    .input-box span:nth-child(5) {
         left: 250px;
    }
    .input-box span:nth-child(6) {
         left: 300px;
    }
     
  </style>
</head>
<body>

<div class="container mt-3">
  <h2>Form Control Size</h2>
  <p>You can change the size of .form-control inputs with .form-control-lg or .form-control-sm:</p>
  <form>
  <div class="position-relative ">
    <input type="text" class="form-control form-control-lg" style="letter-spacing: 50px;">
    <div class="input-box">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>
   </div>
    <input type="text" class="form-control mt-3" placeholder="Normal input">
    <input type="text" class="form-control form-control-sm mt-3" placeholder="Small input">
  </form>
</div>

</body>
</html>
